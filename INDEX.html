<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#130c24">
  <meta name="description" content="A living, interactive 4K Jagannath wallpaper.">
  <title>Jaya Jagannath — Living Wallpaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --gold: #f2c56b;
      --ivory: #f9edcf;
      --muted: #b7a9c5;
      --ink: #130c24;
      --glass: #190f2bbd;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow: hidden;
      background: #10091e;
      color: var(--ivory);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .wallpaper {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      isolation: isolate;
      background: #130c24;
    }
    .artwork {
      position: absolute;
      inset: -2.5%;
      width: 105%;
      height: 105%;
      object-fit: cover;
      transition: filter .7s ease, transform .2s ease-out;
      will-change: transform;
    }
    .artwork.is-still { transform: none !important; }
    .vignette {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, #0d081950 0%, transparent 22%, transparent 70%, #0c0715b8 100%),
        radial-gradient(ellipse at 50% 48%, transparent 34%, #0b071552 100%);
    }
    .topbar, .bottom-bar {
      position: absolute;
      z-index: 3;
      right: clamp(20px, 5vw, 82px);
      left: clamp(20px, 5vw, 82px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar { top: clamp(20px, 4vh, 42px); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ivory);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid #e9bd7073;
      border-radius: 50%;
      color: var(--gold);
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      letter-spacing: 0;
    }
    .top-actions, .control-group { display: flex; align-items: center; gap: 9px; }
    .icon-button, .download-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid #f1d89c3b;
      border-radius: 999px;
      background: #160e29ad;
      color: var(--ivory);
      cursor: pointer;
      backdrop-filter: blur(14px);
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .icon-button { width: 42px; padding: 0; }
    .download-button { padding: 0 17px; color: #271831; background: var(--gold); border-color: var(--gold); font-size: 11px; font-weight: 700; }
    .icon-button:hover, .download-button:hover { transform: translateY(-2px); border-color: var(--gold); }
    .icon-button:hover { background: #49304c; }
    .download-button:hover { background: #ffda8b; }
    .icon-button svg, .download-button svg { width: 17px; height: 17px; }
    .center-copy {
      position: absolute;
      z-index: 2;
      top: 12.5%;
      left: 50%;
      width: min(94%, 690px);
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 24px #10071980;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: #edcc8c;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .32em;
      text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after { width: 25px; height: 1px; background: #dfb86e80; content: ""; }
    h1 {
      margin: 13px 0 4px;
      color: #fff3d4;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(35px, 5.2vw, 72px);
      font-weight: 500;
      letter-spacing: .12em;
      line-height: .96;
      text-indent: .12em;
    }
    .subheading { margin: 12px 0 0; color: #e6d9c5c7; font-size: 10px; letter-spacing: .19em; }
    .bottom-bar { bottom: clamp(20px, 4.5vh, 48px); align-items: end; }
    .caption { max-width: 240px; color: #e7dcc8; }
    .caption-kicker { margin: 0 0 7px; color: var(--gold); font-size: 9px; font-weight: 600; letter-spacing: .23em; text-transform: uppercase; }
    .caption p:last-child { margin: 0; color: #d3c8d8; font-family: "Cormorant Garamond", Georgia, serif; font-size: 20px; font-style: italic; }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px;
      border: 1px solid #f1d89c30;
      border-radius: 999px;
      background: var(--glass);
      box-shadow: 0 14px 45px #09051155;
      backdrop-filter: blur(18px);
    }
    .control-label { padding-left: 9px; color: #c8b9cf; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .control-divider { width: 1px; height: 20px; background: #f1d89c30; }
    .toggle-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 11px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #f1e7d6;
      cursor: pointer;
      font-size: 10px;
      transition: background .2s ease, color .2s ease;
    }
    .toggle-button:hover, .toggle-button[aria-pressed="true"] { background: #ffffff13; color: var(--gold); }
    .toggle-button svg { width: 15px; height: 15px; }
    .toast {
      position: absolute;
      z-index: 5;
      right: 50%;
      bottom: 98px;
      max-width: calc(100vw - 32px);
      padding: 11px 16px;
      transform: translate(50%, 10px);
      border: 1px solid #f2c56b55;
      border-radius: 999px;
      background: #190f2bed;
      color: #f9edcf;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      backdrop-filter: blur(12px);
    }
    .toast.show { transform: translate(50%, 0); opacity: 1; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 700px) {
      .wallpaper { min-height: 480px; }
      .artwork { inset: -1%; width: 102%; height: 102%; object-position: 50% 50%; }
      .topbar, .bottom-bar { right: 18px; left: 18px; }
      .topbar { top: 18px; }
      .brand { gap: 8px; font-size: 8px; letter-spacing: .14em; }
      .brand-mark { width: 34px; height: 34px; }
      .icon-button { width: 38px; min-height: 38px; }
      .download-button { width: 40px; min-height: 38px; padding: 0; }
      .download-button span { display: none; }
      .center-copy { top: 13%; }
      h1 { font-size: clamp(33px, 8vw, 52px); }
      .eyebrow { font-size: 8px; letter-spacing: .2em; }
      .subheading { font-size: 8px; letter-spacing: .1em; }
      .bottom-bar { bottom: 20px; flex-direction: column; align-items: center; gap: 14px; }
      .caption { display: none; }
      .controls { gap: 5px; }
      .control-label { font-size: 8px; }
      .toggle-button { gap: 6px; padding-inline: 9px; font-size: 9px; }
      .toast { bottom: 81px; }
    }
    @media (max-height: 600px) and (min-width: 701px) {
      .center-copy { top: 8%; }
      h1 { font-size: clamp(35px, 5vh, 52px); }
      .bottom-bar { bottom: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

          <g transform="translate(560 1990) scale(.8)"><use href="#lotus"/></g>

        <path d="M115 2160Q390 1940 680 2160M3160 2160Q3450 1930 3740 2160" fill="none" stroke="#d7a747" stroke-width="9" opacity=".56"/>
        <g fill="#f2c56b" opacity=".86">
          <circle cx="885" cy="1880" r="7"/><circle cx="2965" cy="1870" r="7"/>

    <div class="vignette" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">ଶ</span><span>Sacred skies · Puri, Odisha</span></div>
      <div class="top-actions">
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="Enter fullscreen" title="Toggle fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
        </button>
        <button class="download-button" id="downloadButton" type="button" title="Download the wallpaper at 3840 by 2160 pixels">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/></svg>
          <span>Download 4K</span>
        </button>
      </div>
    </header>

    <div class="center-copy">
      <span class="eyebrow">The Lord of the Universe</span>
      <h1>JAYA JAGANNATH</h1>
      <p class="subheading">A MOMENT OF STILLNESS · AN ETERNAL PRESENCE</p>
    </div>

    <footer class="bottom-bar">
      <div class="caption">
        <p class="caption-kicker">From the heart of Puri</p>
        <p>May every road lead you home.</p>
      </div>
      <div class="controls" aria-label="Wallpaper controls">
        <span class="control-label">Experience</span>
        <span class="control-divider" aria-hidden="true"></span>
        <button class="toggle-button" id="motionButton" type="button" aria-pressed="true" aria-label="Turn parallax motion off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.64 5.64l2.12 2.12m8.48 8.48 2.12 2.12m0-12.72-2.12 2.12m-8.48 8.48-2.12 2.12"/><circle cx="12" cy="12" r="4"/></svg>
          <span>Motion</span>
        </button>
        <button class="toggle-button" id="glowButton" type="button" aria-pressed="false" aria-label="Turn divine glow on">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2v3m0 14v3M4.93 4.93l2.12 2.12m9.9 9.9 2.12 2.12M2 12h3m14 0h3m-17.07 7.07 2.12-2.12m9.9-9.9 2.12-2.12"/><circle cx="12" cy="12" r="4"/></svg>
          <span>Glow</span>
        </button>
      </div>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <span class="sr-only" id="screenReaderStatus" aria-live="polite"></span>
  </main>

  <script>
    const artwork = document.querySelector("#wallpaperArt");
    const motionButton = document.querySelector("#motionButton");
    const glowButton = document.querySelector("#glowButton");
    const fullscreenButton = document.querySelector("#fullscreenButton");
    const downloadButton = document.querySelector("#downloadButton");
    const toast = document.querySelector("#toast");
    const screenReaderStatus = document.querySelector("#screenReaderStatus");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let motionEnabled = !reducedMotion.matches;
    let toastTimer;

    function announce(message) {
      toast.textContent = message;
      toast.classList.add("show");
      screenReaderStatus.textContent = message;
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function setMotion(enabled) {
      motionEnabled = enabled;
      motionButton.setAttribute("aria-pressed", String(enabled));
      motionButton.setAttribute("aria-label", `Turn parallax motion ${enabled ? "off" : "on"}`);
      if (!enabled) artwork.style.transform = "";
      announce(`Parallax motion ${enabled ? "on" : "off"}`);
    }

    motionButton.addEventListener("click", () => setMotion(!motionEnabled));
    window.addEventListener("pointermove", (event) => {
      if (!motionEnabled || event.pointerType === "touch") return;
      const x = (event.clientX / window.innerWidth - .5) * -12;
      const y = (event.clientY / window.innerHeight - .5) * -8;
      artwork.style.transform = `translate3d(${x}px, ${y}px, 0) scale(1.015)`;
    }, { passive: true });
    window.addEventListener("pointerleave", () => {
      if (motionEnabled) artwork.style.transform = "";
    });

    glowButton.addEventListener("click", () => {
      const enabled = glowButton.getAttribute("aria-pressed") !== "true";
      glowButton.setAttribute("aria-pressed", String(enabled));
      glowButton.setAttribute("aria-label", `Turn divine glow ${enabled ? "off" : "on"}`);
      artwork.style.filter = enabled ? "brightness(1.12) saturate(1.1)" : "";
      announce(`Divine glow ${enabled ? "on" : "off"}`);
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.querySelector(".wallpaper").requestFullscreen();
        }
      } catch (error) {
        announce("Fullscreen is unavailable in this browser.");
      }
    });

    document.addEventListener("fullscreenchange", () => {
      const isFullscreen = Boolean(document.fullscreenElement);
      fullscreenButton.setAttribute("aria-label", isFullscreen ? "Exit fullscreen" : "Enter fullscreen");
      screenReaderStatus.textContent = isFullscreen ? "Entered fullscreen" : "Exited fullscreen";
    });

    downloadButton.addEventListener("click", async () => {
      downloadButton.disabled = true;
      downloadButton.setAttribute("aria-busy", "true");
      try {
        const svgSource = new XMLSerializer().serializeToString(artwork);
        const svgBlob = new Blob([svgSource], { type: "image/svg+xml;charset=utf-8" });
        const svgUrl = URL.createObjectURL(svgBlob);
        const image = new Image();
        image.src = svgUrl;
        await image.decode();

        const canvas = document.createElement("canvas");
        canvas.width = 3840;
        canvas.height = 2160;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Canvas is unavailable");
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(svgUrl);

        const pngBlob = await new Promise((resolve, reject) => {
          canvas.toBlob((result) => result ? resolve(result) : reject(new Error("PNG export failed")), "image/png");
        });
        const downloadUrl = URL.createObjectURL(pngBlob);
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = "jaya-jagannath-4k.png";
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        announce("Your 4K wallpaper is ready.");
      } catch (error) {
        console.error("Could not export the 4K wallpaper.", error);
        announce("The 4K download failed. Please try again.");
      } finally {
        downloadButton.disabled = false;
        downloadButton.removeAttribute("aria-busy");
      }
    });
  </script>
